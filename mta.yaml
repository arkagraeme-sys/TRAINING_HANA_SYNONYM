_schema-version: "2.1"
ID: TRAINING_HANA_SYNONYM
version: 0.0.1
modules:
- name: db
  type: hdb
  path: db
  requires:
  - name: hdi_db
    properties:
      TARGET_CONTAINER: ~{hdi-container-name}

  - name: hdi_source
    group: SERVICE_REPLACEMENTS
    properties:
      key: source_hdi
      service: ~{source-service-name}

resources:
- name: hdi_db
  type: com.sap.xs.hdi-container
  properties:
    hdi-container-name: ${service-name}

- name: hdi_source
  type: org.cloudfoundry.existing-service
  parameters:
    service-name: TRAINING_HANA-hdidb-ws-payy2
  properties:
    source-service-name: TRAINING_HANA-hdidb-ws-payy2